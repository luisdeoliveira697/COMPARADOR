<!DOCTYPE html>
<html lang="es">
<head>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f5f3ef; --panel:#ffffff; --ink:#1f1c18; --ink2:#5d574f; --ink3:#8d867c; --line:#e5e0d8; --line2:#d6cfc4;
  --acc:#e0661b; --acc2:#c4520f; --accbg:#fdf0e6; --ok:#1f8a4c; --okbg:#e6f5ec; --warn:#b7791f; --warnbg:#fdf5e3; --bad:#c0392b; --badbg:#fbeae8;
  --blue:#2463a6; --bluebg:#e8f0fa; --r:10px; --sh:0 1px 2px rgba(40,30,20,.06),0 2px 10px rgba(40,30,20,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#171512; --panel:#211e1a; --ink:#f1ece4; --ink2:#bdb5aa; --ink3:#8a8278; --line:#34302a; --line2:#463f37;
    --accbg:#3a2516; --okbg:#173225; --warnbg:#3a2f17; --badbg:#3b1d1a; --bluebg:#172a3f; --sh:none; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:18px 18px 80px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.spacer{flex:1}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
nav.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:11px;margin-right:6px;color:var(--ink2)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
nav.tabs button.on .n{background:var(--acc);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14px;margin:14px 0 8px}
.muted{color:var(--ink2)} .small{font-size:12px} .tiny{font-size:11px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ai{border-color:#8b6fd6;color:#6a4fc4}
@media (prefers-color-scheme: dark){.btn.ai{color:#b9a5f2}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:500}
label.f .h{font-weight:400;color:var(--ink3);font-size:11px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
input.num{width:90px;text-align:right}
input.tbl{padding:4px 6px;font-size:13px}
label.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:30px;text-align:center;background:var(--panel);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--accbg)}
.drop b{font-size:15px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:600;background:var(--panel);position:sticky;top:0;z-index:1;white-space:nowrap}
td.r,th.r{text-align:right}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--bg)}
td.best{background:var(--okbg)!important;color:var(--ok);font-weight:600}
td.na{color:var(--ink3)}
tr.det td{background:var(--bg)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.hi{background:var(--bluebg);color:var(--blue)} .tag.dud{background:var(--warnbg);color:var(--warn)} .tag.one{background:var(--line);color:var(--ink2)} .tag.bad{background:var(--badbg);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--ink2)}
.stat.hl{background:var(--acc);border-color:var(--acc);color:#fff}
.stat.hl .l{color:#ffe3cf}
.sup{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:12px;overflow:hidden}
.sup>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.sup>.hd .nm{font-weight:700;font-size:15px}
.sup>.bd{padding:4px 14px 14px;border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mtbl td,.mtbl th{padding:5px 6px}
.mtbl input[type=text]{width:100%}
.note{background:var(--bluebg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warnbg)} .note.bad{background:var(--badbg)} .note.ok{background:var(--okbg)}
.empty{text-align:center;padding:40px 20px;color:var(--ink2)}
.modal-bg{position:fixed;inset:0;background:rgba(20,15,10,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal{background:var(--panel);border-radius:14px;max-width:980px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.prog>div{height:100%;background:var(--acc);transition:width .3s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:13px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.plan-sup{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:14px}
.plan-sup .hd{padding:14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.plan-sup .bd{padding:14px}
.brk{display:grid;grid-template-columns:1fr auto;gap:3px 18px;font-size:13px;max-width:460px}
.brk .t{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.mlist{font-size:12px;margin-top:8px}
.mlist div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line)}
.mlist div.win{color:var(--ok);font-weight:600}
details summary{cursor:pointer;color:var(--ink2);font-weight:500}
.hide{display:none!important}
.sel-cols select{width:100%}
.pv td{white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.pv td.hl{background:var(--accbg)}
kbd{font-family:inherit;background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:0 4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.1-.4-.4-2.1z"/></svg></div>
    <div>
      <h1>Comparador de Proveedores</h1>
      <div class="sub">Cruza catálogos, aplica descuentos y métodos de pago, y arma el pedido más barato.</div>
    </div>
    <div class="spacer"></div>
    <span id="ratesBar" class="row" style="gap:6px"></span>
    <span id="storePill" class="pill">Conectando…</span>
    <button class="btn sm" data-act="settings" title="Ajustes">⚙ Ajustes</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="cat"><span class="n">1</span>Catálogos</button>
    <button data-tab="prov"><span class="n">2</span>Proveedores y pagos</button>
    <button data-tab="comp"><span class="n">3</span>Comparativa</button>
    <button data-tab="plan"><span class="n">4</span>Pedido óptimo</button>
  </nav>
  <main id="main"></main>
</div>
<input type="file" id="fileIn" multiple accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt,.pdf,image/*" class="hide">
<div id="modalRoot"></div>

<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const nf2 = new Intl.NumberFormat('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const nf4 = new Intl.NumberFormat('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 4});
const nf0 = new Intl.NumberFormat('es-VE', {maximumFractionDigits: 0});
const sleep = ms => new Promise(r => setTimeout(r, ms));
const COLORS = ['#e0661b','#2463a6','#1f8a4c','#8b4fc4','#c0392b','#0f8b8d','#b7791f','#d14d8b','#4a5560','#6b8e23'];

function parseNum(v, dec) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v ?? '').trim();
  if (!s) return NaN;
  const neg = /^-|\(.*\)/.test(s);
  s = s.replace(/[^\d.,]/g, '');
  if (!/\d/.test(s)) return NaN;
  const hasC = s.includes(','), hasD = s.includes('.');
  if (!dec) {
    if (hasC && hasD) dec = s.lastIndexOf(',') > s.lastIndexOf('.') ? ',' : '.';
    else if (hasC) dec = /^\d{1,3}(,\d{3})+$/.test(s) ? '.' : ',';
    else if (hasD) dec = /^\d{1,3}(\.\d{3}){2,}$/.test(s) ? ',' : '.';
    else dec = '.';
  }
  if (dec === ',') s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? (neg ? -n : n) : NaN;
}
const num = v => { const n = parseNum(v); return isFinite(n) ? n : 0; };
function detectDec(values) {
  let c = 0, d = 0;
  for (const v of values) {
    if (typeof v !== 'string') continue;
    const s = v.replace(/[^\d.,]/g, '');
    if (/\d,\d{1,2}$/.test(s) || /\.\d{3},/.test(s)) c++;
    else if (/\d\.\d{1,2}$/.test(s) || /,\d{3}\./.test(s)) d++;
  }
  return c > d ? ',' : d > c ? '.' : null;
}
function toast(msg, ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function supColor(sid) { const i = S.suppliers.findIndex(s => s.id === sid); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; }
function supName(sid) { return S.suppliers.find(s => s.id === sid)?.name || '¿?'; }

/* ================= estado ================= */
const DEF_GLOBAL = {myRate: '', myRateSrc: 'binance', myEurSrc: 'bcv', myEurRate: '', costMoney: '', iva: 16, showCur: 'USD', allowBrands: true};
const S = {
  global: {...DEF_GLOBAL},
  suppliers: [],
  catalogs: {},           // sid -> {files:[], date, items:[]}
  rates: null,            // tasas del día (BCV $, BCV €, Binance)
  decisions: {ok: {}, no: {}},
  pack: {},               // itemKey -> unidades por empaque (manual)
  qty: {},                // itemKey -> cantidad
};
const UI = {tab: 'cat', compFilter: 'match', compSearch: '', compLimit: 100, openGroup: null, openSup: null, plan: null, planDirty: true};
let M = null;             // resultado del cruce
let matchDirty = true;
const G = () => ({
  myRate: myBs('USD'), costMoney: num(S.global.costMoney), iva: num(S.global.iva),
  showCur: S.global.showCur, allowBrands: S.global.allowBrands !== false
});

const PRESETS = [
  {name: 'Efectivo USD', currency: 'USD'}, {name: 'Zelle', currency: 'USD'}, {name: 'Transferencia en USD', currency: 'USD'},
  {name: 'Transferencia Bs', currency: 'Bs'}, {name: 'Efectivo EUR', currency: 'EUR'}, {name: 'Pago móvil', currency: 'Bs'}, {name: 'Punto de venta', currency: 'Bs'},
  {name: 'Tarjeta de crédito', currency: 'Bs'}, {name: 'Crédito 15 días', currency: 'USD', days: 15},
  {name: 'Crédito 30 días', currency: 'USD', days: 30}, {name: 'Otro', currency: 'USD'}
];
function newTerm(t = {}) { return {days: t.days ?? '', disc: t.disc ?? '', discMin: t.discMin ?? ''}; }
function newMethod(p = {}) {
  return {id: uid(), name: p.name || 'Pago de contado', enabled: true, currency: p.currency || 'USD', rateSrc: 'bcv', rate: '', surch: '', fee: '', max: '', terms: [newTerm({days: p.days || ''})]};
}
function newSupplier(name, cur = 'USD') {
  return {id: uid(), name, listCurrency: cur, ivaIncluded: true, discounts: '', tiers: [], minOrder: '', shipping: '', freeShipFrom: '', notes: '', methods: [newMethod({currency: cur})]};
}

/* ================= normalización y cruce ================= */
const STOP = new Set(['de','del','para','con','el','la','los','las','y','en','tipo','marca','ref','cod','codigo','und','unid','unidad','unidades','pza','pzas','pieza','piezas','u','un','una','al','por','a','sin','mod','modelo','art','x','c/u','cu']);
function baseNorm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
const PACK_RES = [
  /\b(?:caja|cja|cj|paquete|paq|pqt|bolsa|blister|bulto|display|rollo|saco|juego|kit|set)\s*(?:de|x|c\/)?\s*(\d{1,5})\s*(?:und|unds|unid|unidades|u|pzas?|piezas?)?\b/,
  /\bc\/\s*(\d{1,5})\b/,
  /\bx\s*(\d{1,5})\s*(?:und|unds|unid|unidades|u|pzas?|piezas?)\b/,
  /\b(\d{1,5})\s*(?:und|unds|unid|unidades|pzas|piezas)\s*(?:x|por)\s*(?:caja|paquete|bolsa|bulto)\b/
];
function detectPack(s) {
  s = baseNorm(s);
  for (const re of PACK_RES) { const m = s.match(re); if (m) { const n = +m[1]; if (n > 1 && n <= 100000) return n; } }
  return 1;
}
function normText(s) {
  s = baseNorm(s);
  for (const re of PACK_RES) s = s.replace(re, ' ');
  s = s.replace(/(\d),(\d)/g, '$1.$2')
    .replace(/["”″“]|''|\bpulgadas?\b|\bpulg\b\.?|\bplg\b\.?|\bpul\b\.?/g, ' in ')
    .replace(/\bmts?\b\.?|\bmetros?\b/g, ' m ')
    .replace(/\bmilimetros?\b/g, ' mm ').replace(/\bcentimetros?\b|\bcms\b/g, ' cm ')
    .replace(/\bkilos?\b|\bkgs\b|\bkilogramos?\b/g, ' kg ').replace(/\bgramos?\b|\bgrs?\b/g, ' g ')
    .replace(/\blitros?\b|\blts?\b/g, ' l ').replace(/\bgalon(es)?\b|\bgl\b|\bgal\b/g, ' gal ')
    .replace(/\bmililitros?\b/g, ' ml ').replace(/\bvoltios?\b/g, ' v ').replace(/\bvatios?\b|\bwatts?\b/g, ' w ')
    .replace(/\bamperios?\b|\bamp\b/g, ' a ')
    .replace(/(\d)([a-z])/g, '$1 $2').replace(/([a-z])(\d)/g, '$1 $2');
  return s;
}
// Sinónimos de ferretería (Venezuela y Latinoamérica): ambos lados se llevan a la misma palabra antes de comparar.
const SYN_RAW = {
  pinza: 'alicate alicates pinzas tenaza tenazas', mandarria: 'marro marros porra porras combo mandarrias',
  destornillador: 'desarmador desarmadores atornillador destornilladores', esmeril: 'pulidora pulidoras amoladora amoladoras esmeriladora',
  sierra: 'segueta seguetas', metrica: 'flexometro flexometros wincha huincha metro', ajustable: 'inglesa',
  tubo: 'tuberia tuberias', bombillo: 'bombilla bombillas foco focos ampolleta', breaker: 'braker interruptor termomagnetico',
  pegamento: 'pega pegas cola adhesivo', paso: 'arresto', regadera: 'ducha duchas', inodoro: 'poceta pocetas wc sanitario',
  lavamanos: 'lavabo lavabos lavamano', fregadero: 'lavaplatos lavaplato', phillips: 'estrella cruz', plano: 'paleta pala',
  taladro: 'taladros', cerradura: 'chapa chapas', bisagra: 'bisagras', tornillo: 'tornillos', manguera: 'mangueras',
  brocha: 'brochas', martillo: 'martillos', serrucho: 'serruchos', candado: 'candados', carretilla: 'carretillas',
  teflon: 'teipe-teflon', extension: 'extensor extensiones', tomacorriente: 'toma tomas enchufe enchufes', llana: 'llanas',
  cuchara: 'palustre palustres', nivel: 'niveles', espatula: 'espatulas', rodillo: 'rodillos', lija: 'lijas', soldadura: 'electrodo electrodos'
};
const SYN = new Map();
function stemWord(t) { if (t.length > 3 && t.endsWith('s')) t = t.slice(0, -1); if (t.length >= 5 && /[aoe]$/.test(t)) t = t.slice(0, -1); return t; }
for (const [canon, alts] of Object.entries(SYN_RAW)) { const c = stemWord(canon); for (const a of alts.split(' ')) SYN.set(stemWord(a), c); SYN.set(c, c); }
function tokenize(s) {
  const out = [];
  for (let t of normText(s).split(/[^a-z0-9.\/]+/)) {
    t = t.replace(/^[.\/]+|[.\/]+$/g, '');
    if (!t || STOP.has(t)) continue;
    if (/^\d/.test(t)) { if (/^\d+(\.\d+)?$/.test(t)) t = String(parseFloat(t)); }
    else { t = stemWord(t); if (SYN.has(t)) t = SYN.get(t); }
    if (t.length === 1 && !/\d/.test(t) && !['m','g','l','v','w','a'].includes(t)) continue;
    out.push(t);
  }
  return out;
}
// Versiones especiales: si solo una descripción la tiene, son productos distintos (ej. mandarria antichispas vs mandarria normal).
const QUAL_VARIANT = new Set(tokenize(`antichispas inoxidable inox galvanizado industrial reforzado electrico inalambrico bateria neumatico hidraulico
  trifasico monofasico bifasico explosion dielectrico aislado impermeable sanitario presion termofusion soldable cementar roscado`.replace(/\s+/g, ' ')));
// Materiales: solo cuentan si AMBAS descripciones dicen el material y son distintos (una descripción más detallada no es una diferencia).
const QUAL_MATERIAL = new Set(tokenize(`bronce cobre laton aluminio acero hierro pvc cpvc pead ppr polietileno plastico`.replace(/\s+/g, ' ')));
// Detalles secundarios (mango, color, acabado, forma): pesan poco.
const QUAL_WEAK = new Set(tokenize(`madera fibra vidrio goma silicona nylon cromado niquelado pavonado profesional pesado liviano blanco negro rojo azul

const CHUNK = 900;

async function saveCatalog(sid) {

  S.suppliers = (cfg.suppliers || []).map(s => ({...newSupplier(s.name), ...s, tiers: s.tiers || [],

async function loadAll() {
  const [cfgD, decD, qD] = await Promise.all([Store.get('config'), Store.get('decisions'), Store.get('qty')]);
  const cfg = P(cfgD, null);
  S.global = {...DEF_GLOBAL}; S.suppliers = []; S.catalogs = {};
  applyCfg(cfg);
  const dec = P(decD, null);
  S.decisions = {ok: dec?.ok || {}, no: dec?.no || {}}; S.pack = dec?.pack || {};
  S.qty = P(qD, {}) || {};
  const idx = cfg?.catIndex || {};
  const jobs = [];
  for (const sid in idx) {
    if (!S.suppliers.find(s => s.id === sid)) continue;
    jobs.push((async () => {
      const parts = await Promise.all(Array.from({length: idx[sid].chunks}, (_, i) => Store.get(`cat-${sid}-${i}`)));
      const items = [];
      for (const d of parts) for (const a of P(d, [])) items.push(unpackItem(a, sid));

function parseFirebaseConfig(txt) {
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('No encontré la configuración');
  let body = txt.slice(a, b + 1)
    .replace(/\/\/.*$/gm, '')
    .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
    .replace(/'([^']*)'/g, '"$1"')
    .replace(/,\s*}/g, '}');
  const cfg = JSON.parse(body);
  if (!cfg.apiKey || !cfg.projectId) throw new Error('Faltan apiKey o projectId');
  return cfg;
}

const MODELS = [['claude-sonnet-5-5', 'Claude Sonnet 5.5 (recomendado)'], ['claude-haiku-5-5', 'Claude Haiku 5.5 (más económico)'], ['claude-opus-5-5', 'Claude Opus 5.5 (el más capaz)']];

function extractJSON(t) {
  t = String(t || '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('Respuesta sin JSON');
  return JSON.parse(t.slice(a, b + 1));
}
async function imageToB64(blob) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo abrir la imagen (formato no compatible con este navegador)')); i.src = url; });
    const max = 2000, sc = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.85).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
async function askJSON(prompt, opts = {}, attempt = 0) {
  const key = LS.get('apiKey');
  if (!key) throw {code: 'no_key', message: 'Falta la clave de la API de Claude. Agrégala en Ajustes.'};
  const content = [];
  for (const img of (opts.images || [])) content.push({type: 'image', source: {type: 'base64', media_type: 'image/jpeg', data: await imageToB64(img)}});
  content.push({type: 'text', text: prompt + '\n\nResponde únicamente con el JSON, sin texto adicional.'});
  let r, j;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: LS.get('model') || MODELS[0][0], max_tokens: 16000, output_config: {effort: opts.effort || 'medium'}, messages: [{role: 'user', content}]})
    });
    j = await r.json().catch(() => null);
  } catch (e) { throw {code: 'network', message: 'Sin conexión con la API de Claude.'}; }
  if (!r.ok) {
    if ((r.status === 429 || r.status === 529 || r.status >= 500) && attempt < 3) { await sleep(8000 * (attempt + 1)); return askJSON(prompt, opts, attempt + 1); }
    throw {code: r.status === 401 ? 'bad_key' : r.status === 429 ? 'rate_limited' : 'api_error', message: j?.error?.message || ('HTTP ' + r.status)};
  }
  const text = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  try { return extractJSON(text); }
  catch (e) { throw {code: 'parse', message: j.stop_reason === 'max_tokens' ? 'La respuesta fue demasiado larga; intenta con un archivo más pequeño.' : 'La respuesta no tenía el formato esperado.'}; }
}
function aiErr(e) {
  if (e?.code === 'no_key') return e.message;
  if (e?.code === 'bad_key') return 'La clave de la API de Claude no es válida. Revísala en Ajustes.';
  if (e?.code === 'rate_limited') return 'Claude está recibiendo muchas solicitudes; espera un momento e intenta de nuevo.';
  return 'Error con Claude: ' + (e?.message || e);
}

}
function ivaHint(h) {

function ivaPairs(rows, cols) {

    const r = [];
    for (const row of rows.slice(0, 200)) { const a = parseNum(row[i]), b = parseNum(row[j]); if (a > 0 && b > 0) r.push(b / a); }
    if (r.length < 3) continue;
    r.sort((x, y) => x - y);
    const med = r[r.length >> 1];

function guessMap(header, rows) {

  const H = header.map(h => baseNorm(h));

    let idx = -1;
    for (const k of d.kw) { idx = H.findIndex((h, i) => !used.has(i) && h && h.includes(k)); if (idx >= 0) break; }
    if (idx >= 0) { map[d.f] = idx; used.add(idx); }
  }
  if (map.desc == null || map.price == null) {
    const cols = Math.max(...rows.slice(0, 60).map(r => r.length), 0);
    const stats = [];
    for (let c = 0; c < cols; c++) {
      let nums = 0, txt = 0, len = 0;
      for (const r of rows.slice(0, 60)) { const v = r[c]; if (v === '' || v == null) continue; if (isFinite(parseNum(v)) && !/[a-z]{3,}/i.test(String(v))) nums++; else { txt++; len += String(v).length; } }

async function readTabular(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  let wb;
  if (['csv','tsv','txt'].includes(ext)) wb = XLSX.read(await f.text(), {type: 'string', raw: true});
  else wb = XLSX.read(await f.arrayBuffer(), {type: 'array'});
  return wb.SheetNames.map(n => ({name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: true, defval: '', blankrows: false})})).filter(s => s.rows.length);
}
async function pdfLines(f) {
  if (!window.pdfjsLib) throw new Error('No se pudo cargar el lector de PDF');
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = new Map();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5] / 3) * 3;
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push({x: it.transform[4], w: it.width, s: it.str});
    }
    const lines = [...rows.entries()].sort((a, b) => b[0] - a[0]).map(([, its]) => {
      its.sort((a, b) => a.x - b.x);
      let out = '', lastEnd = null;
      for (const t of its) { if (lastEnd != null) out += (t.x - lastEnd > 12 ? ' | ' : ' '); out += t.s.trim(); lastEnd = t.x + t.w; }
      return out;
    });
    pages.push(lines);
  }
  return {pdf, pages};
}

  if (priceNames?.[1]) head[6] = 'Precio (' + lab(priceNames[1]) + ')';
  const norm = r => Array.isArray(r) ? [r[0] ?? '', r[1] ?? '', r[2] ?? '', r[3] ?? '', r[4] ?? '', r[5] ?? '', r[6] ?? ''] : [r.codigo || '', r.descripcion || '', r.marca || '', r.unidad || '', r.unidades_por_empaque || '', r.precio ?? '', r.precio_alterno ?? ''];

const AI_PARALLEL = 4;
async function pool(items, n, fn) {
  let next = 0;
  const out = new Array(items.length);
  const worker = async () => { while (next < items.length) { const k = next++; out[k] = await fn(items[k], k); } };
  await Promise.all(Array.from({length: Math.min(n, items.length)}, worker));
  return out;
}
const FATAL = e => ['no_key', 'bad_key', 'cancelled'].includes(e?.code);
async function aiExtractPDF(f, pagesLines, pdf) {

  const conds = new Set();
  const failed = [];
  const t0 = Date.now();
  const tick = (total, unit) => {
    done++;
    const el = (Date.now() - t0) / 1000, left = done ? el / done * (total - done) : 0;
    prog.set(done / total, `${done} de ${total} ${unit} listos${done < total && done >= 2 ? ` · faltan ~${left > 90 ? Math.round(left / 60) + ' min' : Math.max(5, Math.round(left)) + ' s'}` : ''}…`);
  };

    let parts;

      const chunks = []; let cur = '', start = 1;
      pagesLines.forEach((lines, i) => {
        const t = lines.join('\n');
        if (cur && (cur.length + t.length) > 4500) { chunks.push({t: cur, from: start, to: i}); cur = ''; start = i + 1; }
        cur += (cur ? '\n' : '') + `--- página ${i + 1} ---\n` + t;
      });
      if (cur) chunks.push({t: cur, from: start, to: pagesLines.length});
      prog.set(0, `Leyendo ${pagesLines.length} páginas en ${chunks.length} partes, ${AI_PARALLEL} a la vez…`);
      parts = await pool(chunks, AI_PARALLEL, async c => {
        if (prog.cancelled) throw {code: 'cancelled'};
        try {
          const r = await askJSON(EXTRACT_PROMPT('texto (extraído de un PDF; las columnas están separadas por |)') + '\n\nTEXTO:\n' + c.t, {effort: 'low'});
          if (!priceNames && r.columnas_precio?.length) priceNames = r.columnas_precio; (r.condiciones || []).forEach(c => c && conds.add(String(c)));

        finally { if (!prog.cancelled) tick(chunks.length, 'partes'); }
      });
    } else {
      const pages = Array.from({length: pdf.numPages}, (_, i) => i + 1);
      prog.set(0, `Leyendo ${pdf.numPages} páginas escaneadas, ${AI_PARALLEL} a la vez…`);

        if (prog.cancelled) throw {code: 'cancelled'};

          const page = await pdf.getPage(p);

          const r = await askJSON(EXTRACT_PROMPT('imagen de una página de catálogo'), {images: [blob], effort: 'low'});
          if (!priceNames && r.columnas_precio?.length) priceNames = r.columnas_precio; (r.condiciones || []).forEach(c => c && conds.add(String(c)));
          return r.filas || [];
        } catch (e) { if (FATAL(e)) throw e; failed.push(String(p)); return []; }
        finally { if (!prog.cancelled) tick(pages.length, 'páginas'); }
      });
    }
    prog.close();
    const rows = parts.flat();
    if (failed.length) toast(`No se pudieron leer las páginas ${failed.sort((a, b) => parseInt(a) - parseInt(b)).join(', ')}. Revisa la vista previa o vuelve a intentarlo.`, 8000);

function basicPDFSheet(pagesLines) {
  const rows = [['Código','Descripción','Precio']];
  const priceRe = /(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})|\d+[.,]\d{1,2})\s*$/;
  for (const lines of pagesLines) for (let ln of lines) {
    ln = ln.replace(/\s*\|\s*/g, ' | ').trim();
    const m = ln.replace(/[$]|bs\.?|usd/gi, '').trim().match(priceRe);
    if (!m) continue;
    let rest = ln.slice(0, ln.lastIndexOf(m[1].slice(0, 3)) >= 0 ? ln.lastIndexOf(m[1]) : ln.length).replace(/[|$\s]+$/, '').trim();
    const parts = rest.split(' | ').map(s => s.trim()).filter(Boolean);
    let code = '';
    if (parts.length > 1 && /\d/.test(parts[0]) && parts[0].length <= 18 && !/\s/.test(parts[0])) code = parts.shift();
    const desc = parts.filter(p => !/^[\d.,\s]+$/.test(p)).join(' ').trim();
    if (desc.length < 3) continue;
    rows.push([code, desc, m[1]]);
  }
  return {name: 'Extraído', rows};
}

      if (v == null) { const sel = S.suppliers.find(x => x.id === supSel.value); v = sel ? sel.ivaIncluded !== false : true; why = 'No se pudo detectar: revisa y elige.'; }
      if (!ivaTouched) el.querySelector('[data-iva]').value = v ? '1' : '0';

    };
    const header = () => { const rows = rowsOf(); const w = Math.max(...rows.slice(0, 80).map(r => r.length)); return Array.from({length: w}, (_, i) => hdr >= 0 ? String(rows[hdr][i] ?? '') || 'Columna ' + (i + 1) : 'Columna ' + (i + 1)); };
    const drawCols = () => {
      const H = header();
      el.querySelector('[data-cols]').innerHTML = FIELD_DEFS.map(d => `<label class="f">${d.label}<select data-f="${d.f}"><option value="">— no tiene —</option>${H.map((h, i) => `<option value="${i}" ${map[d.f] === i ? 'selected' : ''}>${esc(h.slice(0, 40))}</option>`).join('')}</select></label>`).join('');
      el.querySelectorAll('[data-f]').forEach(s => s.onchange = () => { map[s.dataset.f] = s.value === '' ? undefined : +s.value; if (s.dataset.f === 'price') ivaTouched = false; updateIva(); drawPv(); });
      updateIva(); drawPv();
    };
    const buildItems = () => {
      const rows = rowsOf().slice(hdr + 1);
      const dec = map.price != null ? detectDec(rows.map(r => r[map.price])) : null;
      const out = [];
      for (const r of rows) {
        const desc = String(r[map.desc] ?? '').replace(/\s+/g, ' ').trim();
        const price = map.price != null ? parseNum(r[map.price], dec) : NaN;
        if (!desc || !(price > 0) || desc.length < 2) continue;
        const unit = map.unit != null ? String(r[map.unit] ?? '').trim() : '';
        let pack = map.pack != null ? parseNum(r[map.pack]) : NaN;
        if (!(pack >= 1)) pack = detectPack(desc + ' ' + unit);
        out.push({code: map.code != null ? String(r[map.code] ?? '').trim() : '', ean: map.ean != null ? String(r[map.ean] ?? '').trim() : '', desc,
          brand: map.brand != null ? String(r[map.brand] ?? '').trim() : '', unit, price, pack0: Math.round(pack)});
      }
      return out;
    };
    const drawPv = () => {
      const items = buildItems();
      el.querySelector('[data-count]').textContent = `· ${items.length} productos válidos`;
      el.querySelector('[data-pv]').innerHTML = `<tr><th>Código</th><th>Descripción</th><th>Marca</th><th>Unidad</th><th class="r">x Emp.</th><th class="r">Precio</th></tr>` +
        items.slice(0, 12).map(it => `<tr><td class="mono">${esc(it.code)}</td><td title="${esc(it.desc)}">${esc(it.desc)}</td><td>${esc(it.brand)}</td><td>${esc(it.unit)}</td><td class="r">${it.pack0}</td><td class="r mono">${nf2.format(it.price)}</td></tr>`).join('') +
        (items.length ? '' : `<tr><td colspan="6" class="muted">Ninguna fila tiene descripción y precio válidos con este mapeo. Ajusta las columnas o la fila de encabezados.</td></tr>`);
    };
    const supSel = el.querySelector('[data-sup]');

    const syncSup = () => {
      const isNew = supSel.value === '__new';

      el.querySelector('[data-curwrap]').style.display = isNew ? '' : 'none';

    supSel.onchange = syncSup; syncSup();
    el.querySelector('[data-sheet]')?.addEventListener('change', e => { si = +e.target.value; initSheet(); });
    el.querySelector('[data-hdr]').onchange = e => { hdr = Math.max(0, +e.target.value || 0) - 1; const rows = rowsOf(); map = guessMap(header(), rows.slice(hdr + 1)); drawCols(); };
    el.querySelector('[data-x]').onclick = () => { m.close(); resolve(false); };
    el.querySelector('[data-ok]').onclick = async () => {
      const items = buildItems();
      if (!items.length) { toast('No hay productos válidos para importar.'); return; }
      let sup;
      if (supSel.value === '__new') {
        const name = el.querySelector('[data-newname]').value.trim() || guessName;
        sup = newSupplier(name, el.querySelector('[data-cur]').value); S.suppliers.push(sup);
      } else sup = S.suppliers.find(s => s.id === supSel.value);
      const mode = el.querySelector('[data-mode]').value;
      const cat = S.catalogs[sup.id] || (S.catalogs[sup.id] = {files: [], items: []});
      if (mode === 'replace') { cat.items = []; cat.files = []; }
      const withIva = el.querySelector('[data-iva]').value === '1';
      if (mode === 'replace' || !cat.items.length) {
        if (sup.ivaIncluded !== withIva) toast(`${sup.name}: precios marcados como ${withIva ? 'con IVA incluido' : 'sin IVA (se sumará el ' + nf2.format(G().iva) + '%)'}.`, 5000);
        sup.ivaIncluded = withIva; saveConfig();
      } else if (sup.ivaIncluded !== withIva) {
        // Se agregan a un catálogo que usa la otra convención: se ajusta el precio para que todo quede igual.
        const f = 1 + G().iva / 100;
        for (const it of items) it.price = withIva ? it.price / f : it.price * f;
      }
      const keys = new Set(cat.items.map(i => i.k));
      const byKey = new Map(cat.items.map(i => [i.k, i]));
      for (const it of items) {
        let k = sup.id + '|' + (it.code ? 'c:' + baseNorm(it.code) : 'd:' + normText(it.desc).replace(/\s+/g, ' ').trim().slice(0, 90));
        if (mode === 'add' && byKey.has(k)) { Object.assign(byKey.get(k), it); prepItem(byKey.get(k)); continue; }
        let k2 = k, n = 2; while (keys.has(k2)) k2 = k + '#' + n++;
        keys.add(k2); it.k = k2; it.sid = sup.id; cat.items.push(prepItem(it));
      }
      cat.files.push(fname); cat.date = new Date().toISOString();
      m.close();
      matchDirty = true; render();
      toast(`${items.length} productos importados para ${sup.name}`);
      await saveCatalog(sup.id);
      resolve(true);
    };
    initSheet();
  });
}

function altSaving(l, sid) {
  const lineObj = UI.plan.lines[l.li]; if (!lineObj) return '';
  const supMap = Object.fromEntries(S.suppliers.map(s => [s.id, s]));
  const mine = unitCost(l.it, supMap[sid]);
  let best = null;
  for (const o of lineObj.opts) { if (o.sid === sid) continue; const c = unitCost(o.it, supMap[o.sid]); if (c && (!best || c.cost < best.c.cost)) best = {c, sid: o.sid}; }
  if (!best || !mine) return '<span class="tiny">único proveedor</span>';
  const d = (best.c.cost - mine.cost) / best.c.cost;
  return d >= 0 ? `<span style="color:var(--ok)">${nf2.format(d * 100)}% vs ${esc(supName(best.sid))}</span>` : `<span class="tiny">${esc(supName(best.sid))} es ${nf2.format(-d * 100)}% más barato por unidad, pero por empaques, mínimos o descuentos del pedido conviene aquí</span>`;
}
function orderText(o) {
  const b = o.best;
  let t = `Pedido para ${o.sup.name}\n`;
  for (const l of o.lines) t += `- ${l.packs}${l.pack > 1 ? ` empaque(s) x${l.pack}` : ''} · ${l.it.code ? '[' + l.it.code + '] ' : ''}${l.it.desc}\n`;
  if (b) t += `\nForma de pago: ${b.m.name}\nTotal estimado: ${fmtCur(b.pay, b.m.currency)}\n`;
  return t;
}

function onBind(e) {
  const el = e.target, [kind, a, b, c] = el.dataset.bind.split(':');
  let v = el.dataset.type === 'bool' ? el.checked : el.dataset.type === 'boolsel' ? el.value === '1' : el.value;
  let rerender = el.tagName === 'SELECT' || el.type === 'checkbox';
  if (kind === 'r') return;
  if (kind === 'g') {
    S.global[b] = v;
    if (b === 'allowBrands') matchDirty = true;
  } else if (kind === 's') {
    const s = S.suppliers.find(x => x.id === a); s[b] = v; if (b === 'name') rerender = false;
  } else if (kind === 'm') {
    const s = S.suppliers.find(x => x.id === a); const m = s.methods.find(x => x.id === b); m[c] = v;
  } else if (kind === 'p') {
    const s = S.suppliers.find(x => x.id === a); const m = s.methods.find(x => x.id === b); m.terms[+c][el.dataset.bind.split(':')[4]] = v;
  } else if (kind === 't') {
    const s = S.suppliers.find(x => x.id === a); s.tiers[+b][c] = v;
  }
  onCfgChange(rerender);
}

const fmtItemAI = (it) => { const sup = S.suppliers.find(x => x.id === it.sid); const pk = itemPack(it);
  return `"${it.desc}"${it.brand ? ` · marca ${it.brand}` : ''}${it.code ? ` · cód. ${it.code}` : ''}${it.unit ? ` · unidad: ${it.unit}` : ''} · precio lista ${fmtCur(it.price, sup?.listCurrency || 'USD')}${pk > 1 ? ` por ${pk} und` : ''}`; };
const STRICT_RULES = `Cómo decidir:
- Primero compara el tipo de producto, la medida/peso/tamaño y la versión. Si coinciden y nada se contradice, SÍ son equivalentes aunque cambie la marca y aunque una descripción sea mucho más detallada que la otra (ej. "Mandarria con mango 2 lb" vs "Mandarria mango de fibra de vidrio 2 lb, cabeza de acero al carbono" → SÍ).
- NO son el mismo si uno es una VERSIÓN ESPECIAL que el otro no es: antichispas, a prueba de explosión, inoxidable, galvanizado, industrial, eléctrico/inalámbrico vs manual, aislado/dieléctrico, de presión vs sanitario, etc. (ej. "Mandarria 20 lb" vs "Mandarria antichispas 20 lb, aluminio-bronce" → NO).
- NO son el mismo si algún dato se CONTRADICE: distinta medida, peso, largo, calibre, voltaje, potencia, capacidad, rosca, número de piezas, o materiales declarados distintos en ambas descripciones.
- El precio es una pista: si el precio por unidad de uno es más del doble que el del otro y no se explica por la presentación, probablemente son productos distintos (versión especial o calidad muy distinta).
- Si de verdad no hay información para decidir, NO.`;
const EQUIV_RULE = () => G().allowBrands
  ? 'Cuentan como iguales si son el mismo producto o un equivalente directo e intercambiable (misma función, tipo, medida, material y especificación) aunque cambie la marca.'
  : 'Solo cuentan como iguales si son el mismo producto de la misma marca y especificación.';
async function aiReview() {
  if (!SAMPLE) { toast('Agrega tu clave de la API de Claude en Ajustes.'); settingsDialog(); return; }
  ensureMatches();
  const pairs = [];
  for (const g of M.groups) if (g.status === 'hi' || g.status === 'dud') for (const m of g.members.slice(1)) if (!S.decisions.ok[pairKey(g.anchor.k, m.it.k)]) pairs.push({a: g.anchor, b: m.it});
  if (!pairs.length) return;
  if (pairs.length > 60 && !await confirmBox('Verificar cruces con Claude', `Claude revisará <b>${nf0.format(pairs.length)}</b> cruces leyendo descripción, especificaciones, marca y precio. Con Haiku cuesta alrededor de ${nf2.format(pairs.length / 30 * 0.002)} USD; con Sonnet, unos ${nf2.format(pairs.length / 30 * 0.02)} USD.`, 'Verificar')) return;
  const prog = progressBox(`Claude está verificando ${pairs.length} cruces`);
  let yes = 0, no = 0;
  try {
    const batches = []; for (let i = 0; i < pairs.length; i += 30) batches.push(pairs.slice(i, i + 30));
    let doneB = 0;
    await pool(batches, AI_PARALLEL, async batch => {
      if (prog.cancelled) return;
      const prompt = `Eres experto en productos de ferretería. Compara cada par de productos de dos proveedores distintos y decide si son el mismo producto.
${EQUIV_RULE()}
${STRICT_RULES}
Si solo cambia la presentación (uno por unidad y otro en caja/paquete de N), sí son iguales: indica en "emp_a"/"emp_b" cuántas unidades trae cada presentación.
Responde SOLO JSON: {"r":[{"id":1,"igual":true,"emp_a":1,"emp_b":1}]}
Pares:
${batch.map((p, j) => { const r = priceRatio(p.a, p.b); return `${j + 1}. A: ${fmtItemAI(p.a)} | B: ${fmtItemAI(p.b)}${r ? ` | precio por unidad: uno es ${nf2.format(r)} veces el otro` : ''}`; }).join('\n')}`;
      let r; try { r = await askJSON(prompt, {effort: 'medium'}); } catch (e) { if (FATAL(e)) throw e; return; }
      finally { doneB++; if (!prog.cancelled) prog.set(doneB / batches.length, `Revisados ${Math.min(doneB * 30, pairs.length)} de ${pairs.length}…`); }
      if (prog.cancelled) return;
      for (const x of r.r || []) {
        const p = batch[x.id - 1]; if (!p) continue;
        const pk = pairKey(p.a.k, p.b.k);
        if (x.igual) {
          S.decisions.ok[pk] = 1; delete S.decisions.no[pk]; yes++;
          if (x.emp_a > 1 && !S.pack[p.a.k] && (p.a.pack0 || 1) === 1) S.pack[p.a.k] = Math.round(x.emp_a);
          if (x.emp_b > 1 && !S.pack[p.b.k] && (p.b.pack0 || 1) === 1) S.pack[p.b.k] = Math.round(x.emp_b);
        } else { S.decisions.no[pk] = 1; delete S.decisions.ok[pk]; no++; }
      }
    });
    prog.close();
  } catch (e) { prog.close(); toast(aiErr(e), 5000); }
  matchDirty = true; saveConfig(); render();
  if (yes + no) toast(`Claude verificó ${yes} cruces como el mismo producto y separó ${no} que no lo son.`, 5000);
}
async function aiFind() {
  if (!SAMPLE) { toast('Agrega tu clave de la API de Claude en Ajustes.'); settingsDialog(); return; }
  ensureMatches();
  const singles = M.groups.filter(g => g.status === 'one');
  const tasks = [];
  for (const g of singles) {
    const it = g.anchor; const sid = g.members[0].sid;
    const acc = new Map();
    for (const t of it.tokSet) { const a = M.index.get(t); if (!a) continue; const w = IDF(t); for (const gi of a) if (gi !== g.id) acc.set(gi, (acc.get(gi) || 0) + w); }
    const cands = [...acc.entries()].filter(([gi]) => !M.groups[gi].sids.has(sid)).sort((a, b) => b[1] - a[1]).slice(0, 30)
      .map(([gi]) => M.groups[gi]).map(og => {
        let best = null, bs = 0;
        for (const m of og.members) { if (S.decisions.no[pairKey(it.k, m.it.k)]) continue; const sc = pairScore(it, m.it); if (sc > bs) { bs = sc; best = m.it; } }
        return best ? {it: best, sc: bs} : null;
      }).filter(x => x && x.sc >= 0.18).sort((a, b) => b.sc - a.sc).slice(0, 6);
    if (cands.length) tasks.push({it, cands});
  }
  if (!tasks.length) { toast('No hay candidatos razonables para los productos sin pareja.'); return; }
  const go = await confirmBox('Buscar parejas con Claude', `Claude revisará <b>${tasks.length}</b> productos sin pareja frente a sus candidatos más parecidos en los otros catálogos. Puede tardar unos minutos.`, 'Empezar');
  if (!go) return;
  const prog = progressBox('Claude está buscando parejas');
  let found = 0;
  try {
    const batches = []; for (let i = 0; i < tasks.length; i += 15) batches.push(tasks.slice(i, i + 15));
    let doneB = 0;
    await pool(batches, AI_PARALLEL, async batch => {
      if (prog.cancelled) return;
      const prompt = `Eres experto en productos de ferretería. Para cada producto, indica cuál de sus candidatos (de otro proveedor) es el mismo producto, o null si ninguno lo es.
${EQUIV_RULE()}
${STRICT_RULES}
Si solo cambia la presentación (unidad vs caja de N), sí es el mismo.
Responde SOLO JSON: {"r":[{"id":1,"elegido":2}]}  (elegido = número del candidato o null)
${batch.map((t, j) => `${j + 1}. Producto: ${fmtItemAI(t.it)}\n${t.cands.map((c, k) => `   ${k + 1}) ${fmtItemAI(c.it)}`).join('\n')}`).join('\n')}`;
      let r; try { r = await askJSON(prompt, {effort: 'medium'}); } catch (e) { if (FATAL(e)) throw e; return; }
      finally { doneB++; if (!prog.cancelled) prog.set(doneB / batches.length, `Revisados ${Math.min(doneB * 15, tasks.length)} de ${tasks.length}…`); }
      if (prog.cancelled) return;
      for (const x of r.r || []) {
        const t = batch[x.id - 1]; if (!t) continue;
        const c = x.elegido ? t.cands[x.elegido - 1] : null;
        if (c) { S.decisions.ok[pairKey(t.it.k, c.it.k)] = 1; found++; }
        else for (const cc of t.cands) S.decisions.no[pairKey(t.it.k, cc.it.k)] = 1;
      }
    });
    prog.close();
  } catch (e) { prog.close(); toast(aiErr(e), 5000); }
  matchDirty = true; saveConfig(); render();
  toast(`Claude encontró ${found} pareja(s) nuevas.`, 4500);
}

/* ================= exportar ================= */
async function exportExcel() {
  const P = UI.plan; if (!P) return;
  const wb = XLSX.utils.book_new();
  const res = [['Proveedor', 'Método de pago', 'Moneda', 'Total a pagar', 'Equivalente USD', 'Valor hoy (USD)', 'Subtotal lista', 'Desc. comercial', 'Desc. volumen %', 'Flete', 'Cumple mínimo']];
  for (const o of Object.values(P.orders)) res.push([o.sup.name, o.best?.m.name || '', o.best?.m.currency || '', o.best ? +o.best.pay.toFixed(2) : '', o.best ? +o.best.usd.toFixed(2) : '', o.best ? +o.best.pv.toFixed(2) : '', +o.goods.toFixed(2), o.sup.discounts || '', +(o.tierPct * 100).toFixed(2), o.ship, o.minOK ? 'Sí' : 'No']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(res), 'Resumen');
  const det = [['Proveedor', 'Código', 'Descripción', 'Cantidad', 'Empaques', 'Unid. x empaque', 'Precio lista', 'Moneda lista', 'Subtotal lista']];
  for (const o of Object.values(P.orders)) for (const l of o.lines) det.push([o.sup.name, l.it.code, l.it.desc, l.qty, l.packs, l.pack, l.it.price, o.sup.listCurrency, +l.sub.toFixed(2)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), 'Pedido por proveedor');
  ensureMatches();
  const supMap = Object.fromEntries(S.suppliers.map(s => [s.id, s]));
  const cmp = [['Producto', ...M.sups.map(s => s.name + ' (costo real/und USD)'), 'Más barato', 'Diferencia %', 'Cruce']];
  for (const g of M.groups) { if (g.status === 'one') continue; const c = groupCosts(g, supMap); cmp.push([g.anchor.desc, ...M.sups.map(s => c.costs[s.id] ? +c.costs[s.id].cost.toFixed(4) : ''), supName(c.bestSid), c.gap != null ? +(c.gap * 100).toFixed(2) : '', {ok: 'Confirmado', hi: 'Alta', dud: 'Dudoso'}[g.status]]); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cmp), 'Comparativa');
  const buf = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
  downloadBlob(new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `pedido-optimo-${new Date().toISOString().slice(0, 10)}.xlsx`);
}
